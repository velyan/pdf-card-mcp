name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: License audit
        run: |
          pip-licenses --fail-on "GNU Affero;AGPL;GPL;LGPL"
      - name: Vulnerability audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements.txt --output-file requirements-audit.txt
          pip-audit --strict -r requirements-audit.txt
          uv export --no-dev --extra table-ml --no-hashes --no-emit-project --format requirements.txt --output-file requirements-table-ml.txt
          pip-audit --strict -r requirements-table-ml.txt
          python scripts/audit_requirement_licenses.py requirements-audit.txt requirements-table-ml.txt

  mcpb:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm install -g @anthropic-ai/mcpb
      - name: Build MCPB artifacts
        run: |
          python scripts/build_mcpb.py --variant all
      - name: Upload MCPB artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pdf-card-mcp-mcpb
          path: |
            dist/*.mcpb
            dist/*.sha256
            server.json
